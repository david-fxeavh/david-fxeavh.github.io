name: Update Gemfile.lock

on:
  workflow_dispatch:  # 允许你手动触发

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false   # 不使用缓存，全新安装

      - name: Install bundler and update gem
        run: |
          gem install bundler
          bundle config set --local path 'vendor/bundle'
          bundle install
          bundle update sass-embedded --conservative

      - name: Commit updated Gemfile.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Gemfile.lock (sass-embedded downgrade)"
          file_pattern: 'Gemfile.lock'