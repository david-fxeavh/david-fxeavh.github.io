name: Update Gemfile.lock (fix sass-embedded)

on:
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Update Gemfile.lock only (no install)
        run: |
          gem install bundler
          bundle lock --update sass-embedded

      - name: Commit updated Gemfile.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Downgrade sass-embedded to compatible version"
          file_pattern: 'Gemfile.lock'